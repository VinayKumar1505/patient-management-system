server:
  port: 4004

auth:
  service:
    url: http://auth-service:4005

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: http://auth-service:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
                
            - id: patient-service-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/patients,/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            #api docs patient-service
            - id: patient-service-api-docs-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients, /v3/api-docs

            #api docs auth-service
            - id: auth-service-api-docs-route
              uri: http://auth-service:4005
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth, /v3/api-docs